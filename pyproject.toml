[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "footyml"
version = "0.1.0"
description = "Football match prediction platform using TabPFN"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.3",
    "polars>=1.0",
    "duckdb>=1.0",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "tabpfn>=2.0",
    "plotly>=5.22",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.7",
    "tqdm>=4.66",
    "pyarrow>=16.0",
    "python-dotenv>=1.0",
    "ipykernel>=7.2.0",
    "countryflag>=1.1.1",
    "matplotlib>=3.10.9",
    "kaleido>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.11",
    "respx>=0.21",
]
notebooks = [
    "jupyterlab>=4.0",
    "nbformat>=5.10",
    "ipywidgets>=8.0",
    "itables>=2.0",
]
dashboard = [
    "streamlit>=1.35",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=footyml --cov-report=term-missing -q"
